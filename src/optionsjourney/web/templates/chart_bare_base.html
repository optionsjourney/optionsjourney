{#- Nav-less page for chart windows on a second monitor: the whole grid
    (?bare=1) and one pane's pop-out (Tracker2's chart_bare_base.html). -#}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Charts{% endblock %}</title>
    {% include '_icons.html' %}
    <script src="{{ url_for('static', filename='vendor/tailwindcss-play.js') }}"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="{{ url_for('static', filename='vendor/socket.io-4.7.4.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tooltips.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/tooltips.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="chart-bare h-screen flex flex-col bg-[#07090d] text-gray-100">
    {% block content %}{% endblock %}
</body>
</html>
