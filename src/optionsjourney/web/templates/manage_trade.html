{% extends "base.html" %}
{% block title %}Manage this trade · OptionsJourney{% endblock %}


{% block content %}
{% set p = entry.position %}
<p><a class="link" href="{{ url_for('journal.trade_page', key=p.key, back=back) }}">← Back to the trade</a></p>

<div class="page-header">
    <div>
        <h1>Manage this trade: {{ entry.name }}</h1>
        <div class="muted small">Opened {{ p.opened_at | market_time }}</div>
    </div>
</div>

{% include "_manage_rules.html" %}
<script type="module" src="{{ url_for('static', filename='js/filter_fields.js') }}"></script>
{% endblock %}
