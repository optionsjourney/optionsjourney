[project]
name = "optionsjourney"
version = "0.7.0"
description = "A local-first options trading journal and automation app."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "DISCLAIMER.md"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "flask-socketio>=5.7.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pillow>=12.3.0",
    "platformdirs>=4.12.4",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "simple-websocket>=1.1.0",
    "sqlalchemy>=2.1.4",
    "time-machine>=2.16.0",
    "tzdata>=2026.5",
    "websockets>=17.2",
]

[project.scripts]
optionsjourney = "optionsjourney.__main__:main"
optionsjourney-menubar = "optionsjourney.launcher.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionsjourney"]

[tool.hatch.build.targets.wheel.force-include]
"docs/guide" = "optionsjourney/guide"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Specs and plans are records; their code blocks are snapshots, not code to format
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
